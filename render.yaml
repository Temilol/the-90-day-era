# Render Blueprint: deploys the app as a free static site.
# In Render: New + → Blueprint → connect this GitHub repo → Apply.
services:
  - type: web
    name: the-90-day-era
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
